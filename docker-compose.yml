name: codeparty3d

services:
  postgres:
    image: postgres:16-alpine
    container_name: codeparty_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: codeparty
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./supabase_migration.sql:/docker-entrypoint-initdb.d/init.sql
      - codeparty_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codeparty"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codeparty_backend
    restart: unless-stopped
    environment:
      PORT: 3000
      HOST_IP: ${HOST_IP:-192.168.1.4}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/codeparty
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codeparty_frontend
    restart: unless-stopped
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  codeparty_pgdata:
